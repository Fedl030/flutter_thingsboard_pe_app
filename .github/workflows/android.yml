name: Android APK (Flutter)
on:
  push: { branches: [ main ] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 'stable' }
      - name: Write configs.json from secret
        run: echo '${{ secrets.CONFIGS_JSON }}' > configs.json
      - name: Get dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons --dart-define-from-file=configs.json
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
